name: Update OpenList Binary
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 必须声明写权限
permissions:
  contents: write

jobs:
  update-binary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Force Overwrite
        run: |
          echo "Downloading latest release..."
          # 下载
          wget https://github.com/OpenListTeam/OpenList/releases/latest/download/openlist-linux-musl-amd64-lite.tar.gz
          
          # 强制解压并覆盖现有的同名文件
          # 注意：tar 默认会覆盖同名文件
          tar -xzf openlist-linux-musl-amd64-lite.tar.gz
          
          # 清理压缩包
          rm openlist-linux-musl-amd64-lite.tar.gz
          
          # 给二进制文件增加执行权限（防止解压后权限丢失）
          # 假设二进制文件名叫 openlist，请根据实际情况修改
          chmod +x openlist || true

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add .
          
          # 只有在有变动时才提交，防止因无变动导致的 Action 报错
          # 如果你希望即使没变动也生成一个提交，可以改用 git commit --allow-empty
          if ! git diff --staged --quiet; then
            git commit -m "chore: force update OpenList binary to latest version"
            git push
          else
            echo "Binary content is identical to the current version, skipping push."
          fi
